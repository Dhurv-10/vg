<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta
name="theme-color"
content="#ff5b9a">

<title>
Date Proposal ❤️
</title>

<link
rel="stylesheet"
href="css/style.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="background">

<div class="blur one"></div>

<div class="blur two"></div>

<div class="blur three"></div>

</div>

<div id="heartContainer"></div>

<div class="wrapper">

<div class="card">
<div class="logo">

    ❤️

</div>

<h1 class="title">

    Will you go on a
    <br>
    Date With Me?

</h1>

<p class="subtitle">

    Think carefully before choosing 😌

</p>

<div class="buttons">

    <button
        id="yesBtn"
        class="yes">

        YES ❤️

    </button>

    <button
        id="noBtn"
        class="no">

        NO 💔

    </button>

</div>

<div class="footer">

    Made with ❤️

</div>

</div>

</div>

<script src="js/script.js"></script>

</body>

</html>
